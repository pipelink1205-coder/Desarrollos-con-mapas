<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambiar contraseña — Mapa de Oferta · EPI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
:root{
  --azul:#1a3a5c;--azul-med:#2563eb;--gris:#f1f5f9;--borde:#e2e8f0;--txt:#0f172a;--txt2:#64748b;
  --rojo:#dc2626;--rojo-bg:#fee2e2;--verde:#15803d;--verde-bg:#dcfce7;
}
html,body{height:100%}
body{background:#152b47;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--txt)}
.card{background:white;border-radius:16px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
h1{font-size:20px;font-weight:700;color:var(--azul);margin-bottom:8px}
.sub{font-size:13px;color:var(--txt2);line-height:1.5;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:600;color:var(--azul);margin-bottom:6px;margin-top:14px}
input{width:100%;padding:11px 14px;border:1px solid var(--borde);border-radius:9px;font-size:14px}
input:focus{outline:none;border-color:var(--azul-med);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
button{width:100%;padding:12px;background:var(--azul-med);color:white;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;margin-top:22px}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:16px;padding:10px 13px;border-radius:8px;font-size:12px;display:none;line-height:1.5}
.msg.error{display:block;background:var(--rojo-bg);color:var(--rojo);border:1px solid #fecaca}
.msg.ok{display:block;background:var(--verde-bg);color:var(--verde);border:1px solid #bbf7d0}
.aviso{background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12px;padding:10px 12px;border-radius:8px;line-height:1.45;margin-bottom:8px}
</style>
</head>
<body>
<div class="card">
  <h1>Cambiar contraseña</h1>
  <p class="sub">Por seguridad debe elegir una contraseña nueva antes de continuar. La contraseña temporal solo sirve para este primer acceso.</p>
  <div class="aviso" role="status">Use una contraseña que recuerde; no comparta su acceso con otras personas.</div>
  <form id="form-cambio" novalidate>
    <label for="pw-nueva">Nueva contraseña</label>
    <input type="password" id="pw-nueva" required autocomplete="new-password" minlength="5">
    <label for="pw-conf">Confirmar contraseña</label>
    <input type="password" id="pw-conf" required autocomplete="new-password" minlength="5">
    <button type="submit" id="btn">Guardar y continuar</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<script type="module">
import { supabase, obtenerPerfil } from './js/supabase-client.js';

const $form = document.getElementById('form-cambio');
const $btn = document.getElementById('btn');
const $msg = document.getElementById('msg');
const $pw = document.getElementById('pw-nueva');
const $conf = document.getElementById('pw-conf');

function mostrarMsg(texto, tipo = 'error') {
  $msg.textContent = texto;
  $msg.className = `msg ${tipo}`;
}

const { data: { session } } = await supabase.auth.getSession();
if (!session) {
  window.location.href = '/index.html';
  throw new Error('redirect');
}

const perfil = await obtenerPerfil();
if (!perfil) {
  mostrarMsg('No se pudo cargar su perfil. Recargue la página.');
  $btn.disabled = true;
} else if (!perfil.debe_cambiar_password) {
  const params = new URLSearchParams(window.location.search);
  const next = params.get('next');
  if (next && next.startsWith('/')) window.location.assign(next);
  else window.location.assign(['admin', 'super_admin'].includes(perfil.rol) ? '/admin.html' : '/mapa.html');
}

const minLen = perfil && perfil.rol === 'consulta' ? 5 : 8;
$pw.minLength = minLen;
$conf.minLength = minLen;

$form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const nueva = $pw.value;
  const conf = $conf.value;
  if (nueva.length < minLen) {
    mostrarMsg(minLen === 5 ? 'Mínimo 5 caracteres.' : 'Mínimo 8 caracteres.');
    return;
  }
  if (nueva !== conf) {
    mostrarMsg('Las contraseñas no coinciden.');
    return;
  }
  $btn.disabled = true;
  $btn.textContent = 'Guardando…';
  $msg.className = 'msg';

  const { error: pwErr } = await supabase.auth.updateUser({ password: nueva });
  if (pwErr) {
    const msg = pwErr.message || '';
    if (/different from the old password/i.test(msg) || /should be different/i.test(msg)) {
      mostrarMsg('La nueva contraseña debe ser distinta de la temporal que usó para entrar.');
    } else {
      mostrarMsg(msg || 'No se pudo actualizar la contraseña.');
    }
    $btn.disabled = false;
    $btn.textContent = 'Guardar y continuar';
    return;
  }

  const { error: flagErr } = await supabase.rpc('marcar_password_cambiada');
  if (flagErr) {
    const { error: flagErr2 } = await supabase
      .from('perfiles')
      .update({ debe_cambiar_password: false })
      .eq('id', perfil.id);
    if (flagErr2) {
      mostrarMsg(
        'Contraseña actualizada, pero no se pudo registrar el cambio. Ejecute sql/16d-marcar-password-cambiada.sql en Supabase o contacte al administrador.',
      );
      $btn.disabled = false;
      $btn.textContent = 'Guardar y continuar';
      return;
    }
  }

  mostrarMsg('Contraseña actualizada. Redirigiendo…', 'ok');
  const params = new URLSearchParams(window.location.search);
  const next = params.get('next');
  setTimeout(() => {
    if (next && next.startsWith('/')) window.location.assign(next);
    else window.location.assign(['admin', 'super_admin'].includes(perfil.rol) ? '/admin.html' : '/mapa.html');
  }, 600);
});
</script>
</body>
</html>
